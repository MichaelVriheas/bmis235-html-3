<!-- HTML: Displays the Greece map and clickable locations. -->

        L329.1 67.3 L303.5 62.9 L244.2 75.1
        L278.1 101.5 L253.2 109.2 L226 109.2
        L200 85 L190.8 95.4 L201.8 123.4
        L226.3 145.5 L207.8 155.8 L235.1 177.4
        L259.4 191.1 L260.1 217.6 L214.8 205.2
        L229.2 229.1 L198.1 234.1 L216.7 275.6
        L184.2 276.1 L144 255.7 L125.6 218.1
        L117 186.8 L97.9 165.2 L72.8 138.4
        L69.5 125 L92.3 102.2 L95.2 87
        L111.1 80.1 L112.1 67.8 L144.2 63.6
        L162.9 53.4 L189.4 54.3 L197.5 46.1
        L206.8 44.5 L243.1 45.9 L282.3 33

      <!-- Crete -->

        L343.7 334 L370.4 328.3
        L364.2 342.2 L293.7 346.2
        L294.2 338.4 L234.4 329.3 Z"/>

      <!-- Greek islands -->

        <ellipse cx="62" cy="126" rx="5" ry="12"/>
        <ellipse cx="91" cy="166" rx="4" ry="10"/>
        <ellipse cx="99" cy="207" rx="5" ry="9"/>
        <ellipse cx="280" cy="158" rx="5" ry="12"
                 transform="rotate(-20 280 158)"/>
        <ellipse cx="300" cy="205" rx="6" ry="9"/>
        <ellipse cx="326" cy="226" rx="5" ry="6"/>
        <ellipse cx="348" cy="177" rx="7" ry="11"/>
        <ellipse cx="365" cy="212" rx="4" ry="9"/>
        <ellipse cx="310" cy="267" rx="5" ry="5"/>
        <ellipse cx="340" cy="273" rx="5" ry="7"/>
      </g>

      <text x="150" y="177" class="greek-map-caption">
        GREECE
      </text>

      <!-- Interactive pins -->
      <g class="greek-marker" data-city="thalames"
         transform="translate(176.3 258.5)"
         role="button" tabindex="0"
         aria-label="Select Thalames"
         aria-pressed="false">
        <title>Thalames</title>
        <circle class="greek-hit" r="11"/>
        <circle class="greek-pin" r="7.5"/>
        <circle class="greek-pin-center" r="2.5"/>
      </g>

      <g class="greek-marker" data-city="kastoria"
         transform="translate(124.1 82.9)"
         role="button" tabindex="0"
         aria-label="Select Kastoria"
         aria-pressed="false">
        <title>Kastoria</title>
        <circle class="greek-hit" r="11"/>
        <circle class="greek-pin" r="7.5"/>
        <circle class="greek-pin-center" r="2.5"/>
      </g>

      <g class="greek-marker" data-city="sparti"
         transform="translate(181.2 244.9)"
         role="button" tabindex="0"
         aria-label="Select Sparti"
         aria-pressed="false">
        <title>Sparti</title>
        <circle class="greek-hit" r="11"/>
        <circle class="greek-pin" r="7.5"/>
        <circle class="greek-pin-center" r="2.5"/>
      </g>

      <g class="greek-marker" data-city="tripoli"
         transform="translate(178.9 224.1)"
         role="button" tabindex="0"
         aria-label="Select Tripoli"
         aria-pressed="false">
        <title>Tripoli</title>
        <circle class="greek-hit" r="11"/>
        <circle class="greek-pin" r="7.5"/>
        <circle class="greek-pin-center" r="2.5"/>
      </g>

      <!-- Popup shown when a pin is selected -->
      <g class="greek-popup" visibility="hidden">
        <rect width="125" height="35" rx="8"
              fill="#ffffff" stroke="#2d5d89"
              stroke-width="1.5"/>
        <text x="62.5" y="22"
              text-anchor="middle"
              class="greek-popup-text"></text>
      </g>
    </svg>

    <!-- Selected city information -->
    <aside class="greek-info">
      <div class="greek-selection">
        <div class="greek-info-caption">DISCOVER A PLACE</div>

             aria-live="polite">Select a pin</div>
        <div class="greek-selected-greek"></div>
        <div class="greek-selected-region">
          Click a map pin to reveal its location.
        </div>
      </div>

           aria-label="Choose a location">

        </button>
        <button type="button" data-city="sparti">

        <button type="button" data-city="tripoli">

      </div>
    </aside>

<!-- CSS: Styles only this graphic using the site's colors. -->
<style>

  background: #f5f0e7;
  border: 2px solid #2d5d89;
  border-radius: 16px;
  overflow: hidden;
  font-family: Georgia, serif;
}

.showcase .greek-map-widget * {
  box-sizing: border-box;
}

.showcase .greek-map-heading {
  padding: 13px 16px 9px;
  text-align: center;
}

.showcase .greek-eyebrow {
  color: #53728d;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 2px;
}

.showcase .greek-map-title {

  font-family: Georgia, serif;

}

  grid-template-columns: minmax(0, 1fr) 210px;
  gap: 10px;
  padding: 0 12px 12px;
}

.showcase .greek-map {
  display: block;
  width: 100%;
  height: 350px;
  border-radius: 12px;
}

.showcase .greek-land {
  fill: #f5f0e7;
  stroke: #2d5d89;
  stroke-width: 1.7;
  stroke-linejoin: round;
}

.showcase .greek-islands {
  fill: #f5f0e7;
  stroke: #2d5d89;
  stroke-width: 1.4;
}

.showcase .greek-map-caption {
  fill: #2d5d89;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  opacity: 0.55;
}

.showcase .greek-marker {
  cursor: pointer;
  outline: none;
}

.showcase .greek-hit {
  fill: transparent;
}

.showcase .greek-pin {
  fill: #bd7135;
  stroke: white;
  stroke-width: 2.5;
}

.showcase .greek-pin-center {

}

  font-size: 15px;
  font-weight: bold;
}

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 13px;
  background: #2d5d89;
  border-radius: 12px;
  color: #ffffff;
}

.showcase .greek-info-caption {

  font-size: 10px;
  letter-spacing: 1px;
  font-weight: bold;
}

.showcase .greek-selected-name {

<!-- JavaScript: Makes pins and location buttons interactive. -->
<script>
(() => {
  const host = document.currentScript.closest(".showcase");
  if (!host) return;

  const widget = host.querySelector(".greek-map-widget");

  const cities = {
    thalames: {
      name: "Thalames",
      greek: "Θαλάμες",
      region: "West Mani, Messenia",
      x: 176.3,
      y: 258.5
    },
    kastoria: {
      name: "Kastoria",
      greek: "Καστοριά",
      region: "Western Macedonia",
      x: 124.1,
      y: 82.9
    },
    sparti: {
      name: "Sparti",
      greek: "Σπάρτη",
      region: "Laconia, Peloponnese",
      x: 181.2,
      y: 244.9
    },
    tripoli: {
      name: "Tripoli",
      greek: "Τρίπολη",
      region: "Arcadia, Peloponnese",
      x: 178.9,
      y: 224.1
    }
  };

  const nameDisplay =
    widget.querySelector(".greek-selected-name");
  const greekDisplay =
    widget.querySelector(".greek-selected-greek");
  const regionDisplay =
    widget.querySelector(".greek-selected-region");
  const popup =
    widget.querySelector(".greek-popup");
  const popupText =
    widget.querySelector(".greek-popup-text");

  const controls = widget.querySelectorAll("[data-city]");

  function selectCity(id) {
    const city = cities[id];
    if (!city) return;

    nameDisplay.textContent = city.name;
    greekDisplay.textContent = city.greek;
    regionDisplay.textContent = city.region;

    popupText.textContent = city.name;

    popup.setAttribute(
      "transform",
      "translate(" + (city.x + 14) + " " + (city.y - 40) + ")"
    );

    popup.setAttribute("visibility", "visible");

    controls.forEach(control => {
      const active = control.dataset.city === id;

      control.classList.toggle("is-selected", active);
      control.setAttribute("aria-pressed", String(active));
    });
  }

  controls.forEach(control => {
    control.addEventListener("click", () => {
      selectCity(control.dataset.city);
    });

    if (control.tagName.toLowerCase() === "g") {
      control.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectCity(control.dataset.city);
        }
      });
    }
  });
})();
</script>
